kind = "web"
previewPath = "/"
title = "المحاسبة المالية العامة"
description = "Responsive Arabic accounting UI built with Flutter and Dart."
version = "1.0.0"
id = "artifacts/accounting"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24339

[services.development]
run = "pnpm --filter @workspace/accounting run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/accounting", "run", "build" ]
serve = "static"
publicDir = "artifacts/accounting/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24339"
BASE_PATH = "/"
